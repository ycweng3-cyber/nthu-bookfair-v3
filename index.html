<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【今晚吃什麼】學長姐的求生輪盤</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Helvetica Neue', Arial, 'Noto Sans TC', sans-serif;
            background: #A99CC7; /* 參考圖片背景的柔和薰衣草紫灰色調 */
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .game-title {
            text-align: center;
            margin-bottom: 20px;
        }
        .game-title h2 { margin: 0; color: #fff; font-size: 1.8rem; text-shadow: 1px 1px 3px rgba(0,0,0,0.2); }
        .game-title p { margin: 5px 0 0 0; color: #eee; font-size: 0.9rem; }

        /* 左右主配置面板 */
        .main-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            width: 100%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }

        /* 左側：轉盤區 */
        .wheel-section {
            position: relative;
            width: 360px;
            height: 360px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* 參考圖片風格的純樸指標 */
        .pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 25px solid #7D7571; /* 圖片中心的溫柔灰褐色 */
            z-index: 10;
            filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.2));
        }
        
        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 10px solid #FFFDF4; /* 圖片外圈的米白奶油色邊框 */
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            transition: transform 4s cubic-bezier(0.1, 0.8, 0.3, 1);
        }
        
        /* 轉盤中心鈕（參考圖片中的圓心鈕設計） */
        #spin-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: #9A928D; /* 圖片中心的灰褐色 */
            color: #fff;
            border: none;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: inset 0px -3px 0px rgba(0,0,0,0.2), 0 4px 8px rgba(0,0,0,0.2);
            z-index: 5;
            letter-spacing: 1px;
        }
        #spin-btn:disabled { background: #bbb; cursor: not-allowed; }

        /* 右側：自定義後台控制區 */
        .control-section {
            flex: 1;
            min-width: 280px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .control-section h3 { margin: 0; color: #4A4441; font-size: 1.2rem; border-bottom: 2px solid #FBC0A8; padding-bottom: 5px;}
        textarea {
            width: 100%;
            height: 220px; /* 加高方便放入10個選項 */
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 0.95rem;
            resize: none;
            line-height: 1.6;
            background: #FAF9F6;
        }
        .btn-update {
            background: #6A8FAF; /* 莫蘭迪藍調 */
            color: white;
            border: none;
            padding: 11px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-update:hover { background: #557796; }

        /* 彈出結果視窗 */
        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            z-index: 100;
            width: 80%;
            max-width: 320px;
        }
        .modal h3 { margin-top: 0; color: #E89E84; }
        .modal button {
            background: #6A8FAF; color: white; border: none;
            padding: 8px 20px; border-radius: 5px; cursor: pointer; margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="game-title">
        <h2>🍱 今晚吃什麼？</h2>
        <p>新鮮人生存指南：學長姐的求生輪盤挑戰</p>
    </div>

    <div class="main-container">
        <!-- 左側轉盤 -->
        <div class="wheel-section">
            <div class="pointer"></div>
            <canvas id="wheel" width="500" height="500"></canvas>
            <button id="spin-btn">GO</button>
        </div>

        <!-- 右側即時文字編輯後台 -->
        <div class="control-section">
            <h3>⚙️ 轉盤文字自定義後台</h3>
            <p style="margin:0; font-size:0.85rem; color:#666;">請輸入您的 10 大求生美食地圖（每行一個）：</p>
            <textarea id="options-input">
1. 宵夜街神級炸雞
2. 東門市場文青料理
3. 城隍廟百年肉圓
4. 研究生續命咖啡
5. 清大清茂麵線
6. 大吃市人氣滷肉飯
7. 水木餐廳經典排骨
8. 經國路深夜串燒
9. 校門口隱藏版綠洲
10. 竹科工程師愛店肉羹
            </textarea>
            <button class="btn-update" onclick="updateWheel()">更新轉盤選項</button>
        </div>
    </div>

    <!-- 結果彈窗 -->
    <div id="resultModal" class="modal">
        <p style="margin:0; color:#666;">今晚的命定晚餐是：</p>
        <h3 id="prize-text" style="font-size:1.4rem; margin: 10px 0;"></h3>
        <button onclick="closeModal()">太棒了！</button>
    </div>

    <script>
        const canvas = document.getElementById("wheel");
        const ctx = canvas.getContext("2d");
        const spinBtn = document.getElementById("spin-btn");
        const modal = document.getElementById("resultModal");
        const prizeText = document.getElementById("prize-text");
        const optionsInput = document.getElementById("options-input");

        // 🎨 依據 image_6a8581.png 延伸的 10 色深淺交錯調色盤
        const colorPalette = [
            "#FBC0A8", // 1. 粉橘（基礎原色）
            "#6A8FAF", // 2. 莫蘭迪藍（基礎原色）
            "#FCD3C1", // 3. 淺粉橘（明亮）
            "#82A5C3", // 4. 淺莫蘭迪藍（明亮）
            "#E89E84", // 5. 深粉橘（飽和偏沉）
            "#557796", // 6. 深莫蘭迪藍（沉穩）
            "#FDE3D6", // 7. 極淺柔粉橘
            "#9BBED4", // 8. 極淺灰藍
            "#D6866B", // 9. 焙茶焦粉橘
            "#435D75"  // 10. 夜幕暗藍
        ];
        
        let options = [];

        function updateWheel() {
            options = optionsInput.value.split('\n')
                .map(opt => opt.trim())
                .filter(opt => opt.length > 0);

            if (options.length < 2) {
                alert("請至少輸入兩個選項！");
                return;
            }
            drawWheel();
        }

        function drawWheel() {
            const numSegments = options.length;
            const segmentAngle = (2 * Math.PI) / numSegments;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const radius = canvas.width / 2;
            
            ctx.textBaseline = "middle";
            ctx.textAlign = "right";
            ctx.font = "bold 18px sans-serif";

            for (let i = 0; i < numSegments; i++) {
                const angle = i * segmentAngle;
                
                // 畫扇形
                ctx.beginPath();
                ctx.moveTo(radius, radius);
                ctx.arc(radius, radius, radius, angle, angle + segmentAngle);
                ctx.fillStyle = colorPalette[i % colorPalette.length];
                ctx.fill();

                // 細白邊分隔線增加精緻感
                ctx.strokeStyle = "rgba(255,255,255,0.6)";
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // 寫文字
                ctx.save();
                ctx.translate(radius, radius);
                ctx.rotate(angle + segmentAngle / 2);
                
                // 為了閱讀舒適度，極深色背景（最後一色）字體用白色，其他用內斂的深炭灰
                ctx.fillStyle = (i % colorPalette.length === 9) ? "#ffffff" : "#3D3735"; 
                
                ctx.fillText(options[i], radius - 35, 0);
                ctx.restore();
            }
        }

        let isSpinning = false;
        spinBtn.addEventListener("click", () => {
            if (isSpinning || options.length < 2) return;
            isSpinning = true;
            spinBtn.disabled = true;

            const numSegments = options.length;
            const extraDegrees = Math.floor(Math.random() * 360);
            const totalRotation = (8 + Math.floor(Math.random() * 5)) * 360 + extraDegrees;
            
            canvas.style.transform = `rotate(${totalRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                spinBtn.disabled = false;

                const actualDegrees = totalRotation % 360;
                const pointerAngle = (360 - actualDegrees + 270) % 360;
                const winningIndex = Math.floor(pointerAngle / (360 / numSegments)) % numSegments;

                prizeText.innerText = options[winningIndex];
                modal.style.display = "block";
                
                canvas.style.transition = "none";
                canvas.style.transform = `rotate(${actualDegrees}deg)`;
                canvas.offsetHeight; 
                canvas.style.transition = "transform 4s cubic-bezier(0.1, 0.8, 0.3, 1)";
            }, 4000);
        });

        function closeModal() { modal.style.display = "none"; }

        // 初始化
        updateWheel();
    </script>
</body>
</html>
